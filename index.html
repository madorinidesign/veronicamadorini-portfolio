<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veronica Madorini — UI/UX Designer</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/favicon-dark.png">
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/favicon-light.png">
    <link rel="icon" type="image/png" href="/favicon-dark.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        (function() {
            if (typeof window !== 'undefined') {
                var vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--initial-vh', vh + 'px');
                
                if (window.matchMedia) {
                    var setFavicon = function(e) {
                        var dark = e ? e.matches : window.matchMedia('(prefers-color-scheme: dark)').matches;
                        var faviconLink = document.querySelector('link[rel="shortcut icon"]');
                        if (faviconLink) {
                            faviconLink.href = dark ? '/favicon-dark.png' : '/favicon-light.png';
                        }
                    };
                    var matcher = window.matchMedia('(prefers-color-scheme: dark)');
                    if (matcher.addEventListener) {
                        matcher.addEventListener('change', setFavicon);
                    } else if (matcher.addListener) {
                        matcher.addListener(setFavicon);
                    }
                    setFavicon();
                }
            }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
